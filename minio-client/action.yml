name: 'Minio Client'
inputs:
  run:
    description: 'Run command in container'
    required: true
  host:
    description: 'Minio endpoint of object storage host'
    required: true
  access_key:
    description: 'Minio access key (username)'
    required: true
  secret_key:
    description: 'Minio secret key (password)'
    required: true
  alias:
    description: 'Name of the host alias'
    required: false
    default: host
  ca_cert:
    description: 'CA Cert to use for Minio Client'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Run MinIo Docker Container
      uses: peeriot/actions/docker-run@7877bfbb5dd22ed0d88c1566792b2c9ca07aab08
      env:
        MINIO_HOST: ${{ inputs.host }}
        MINIO_ACCESS_KEY: ${{ inputs.access_key }}
        MINIO_SECRET_KEY: ${{ inputs.secret_key }}
        MINIO_ALIAS: ${{ inputs.alias }}
        MINIO_RUN: ${{ inputs.run }}
        MINIO_CA_CERT: ${{ inputs.ca_cert }}
      with:
        image: minio/mc:RELEASE.2024-10-08T09-37-26Z
        username: ${{ github.actor }}
        password: ${{ github.token }}
        user: user
        setup_known_hosts: false
        entrypoint: ${{ github.action_path }}/exec.sh
