name: 'Check'
description: 'Run Rust checks and tests for a Cargo workspace inside a Docker container.'

inputs:
  token:
    description: 'Github App token generated by setup step.'
    required: true
  only_test_packages:
    description: 'List of packages to test. If empty, the whole workspace is tested.'
  image:
    description: 'The docker image to run the tests in. Needs all rust dependencies installed already.'
  directory:
    description: 'The cargo workspace directory relative to the project directory. If empty, the project directory is used.'
    default: '.'
  command_suffix:
    description: 'A suffix to append to all commands.'
    default: ''

runs:
  using: "composite"
  steps:
    - name: Check
      uses: "peeriot/actions/docker-run@0fb56a0dc9de22b304b7ed5a6be8079339e9ed48"
      env:
        CARGO_NET_GIT_FETCH_WITH_CLI: true
        ONLY_TEST_PACKAGES: ${{ inputs.only_test_packages }}
        CHECK_DIRECTORY: ${{ inputs.directory }}
        COMMAND_SUFFIX: ${{ inputs.command_suffix }}
      with:
        image: ${{ inputs.image }}
        username: ${{ github.actor }}
        password: ${{ github.token }}
        user: user
        token: ${{ inputs.token }}
        volumes: |
          cache-cargo:/usr/local/cargo
          cache-rustup:/usr/local/rustup
          target:${{ env.GITHUB_WORKSPACE }}/${{ inputs.directory }}/target,lockfiles=${{ inputs.directory }}/Cargo.lock
        run: |
          ${{ github.action_path }}/check
